name: MLForge - Publish Model

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: "Successful optimization workflow run ID"
        required: true
        type: string
      version:
        description: "Model version, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          mkdir -p release

          gh run download "$RUN_ID" \
            --name mlforge-optimization-results \
            --dir release

          test -s release/best_model.joblib
          test -s release/metadata.json

      - name: Create checksums
        run: |
          cd release
          sha256sum best_model.joblib metadata.json \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            release/best_model.joblib \
            release/metadata.json \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MLForge Model $VERSION" \
            --notes "Cloud-trained churn prediction model."
