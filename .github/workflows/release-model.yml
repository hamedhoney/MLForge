name: MLForge - Publish Model

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: "Successful Cloud Training run ID"
        required: true
        type: string
      quality_gate_run_id:
        description: "Successful Model Quality Gate run ID"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mlforge-model-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify provenance and publish existing tag
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate run IDs
        env:
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          [[ "$TRAINING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$QUALITY_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Verify training and quality-gate runs
        env:
          GH_TOKEN: ${{ github.token }}
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          gh run view "$TRAINING_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,workflowName,event \
            > "$RUNNER_TEMP/training_run.json"

          gh run view "$QUALITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,workflowName,event \
            > "$RUNNER_TEMP/quality_run.json"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          training = json.loads(
              (root / "training_run.json").read_text()
          )
          quality = json.loads(
              (root / "quality_run.json").read_text()
          )

          for info, name in (
              (training, "MLForge - Cloud Training"),
              (quality, "MLForge - Model Quality Gate"),
          ):
              if info["conclusion"] != "success":
                  raise SystemExit(f"{name} did not succeed")

              if info["workflowName"] != name:
                  raise SystemExit("Unexpected workflow identity")

              if info["event"] != "workflow_dispatch":
                  raise SystemExit("Unexpected workflow trigger")

              if info["headBranch"] != "main":
                  raise SystemExit("Workflow did not run on main")

          commit = training["headSha"]

          if not re.fullmatch(r"[0-9a-fA-F]{40}", commit):
              raise SystemExit("Invalid training commit")

          if quality["headSha"] != commit:
              raise SystemExit(
                  "Training and quality gate used different commits"
              )

          print("Verified common commit:", commit)
          PY

      - name: Resolve existing model tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin --tags

          TRAINING_SHA=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "training_run.json")
              .read_text()
          )
          print(info["headSha"])
          PY
          )

          export TRAINING_SHA

          python - <<'PY'
          import os
          import re
          import subprocess

          commit = os.environ["TRAINING_SHA"]

          tags = subprocess.check_output(
              ["git", "tag", "--list"],
              text=True,
          ).splitlines()

          matches = []

          for tag in tags:
              if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  continue

              resolved = subprocess.check_output(
                  ["git", "rev-list", "-n", "1", tag],
                  text=True,
              ).strip()

              if resolved == commit:
                  matches.append(tag)

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one model version tag "
                  f"for commit {commit}; found: {matches}"
              )

          version = matches[0]

          remote = subprocess.check_output(
              [
                  "git",
                  "ls-remote",
                  "origin",
                  f"refs/tags/{version}",
                  f"refs/tags/{version}^{{}}",
              ],
              text=True,
          )

          refs = dict(
              (ref, sha)
              for sha, ref in (
                  line.split()
                  for line in remote.splitlines()
              )
          )

          tag_ref = f"refs/tags/{version}"
          peeled_ref = f"{tag_ref}^{{}}"

          if tag_ref not in refs:
              raise SystemExit("Version tag is not on origin")

          if refs.get(peeled_ref, refs[tag_ref]) != commit:
              raise SystemExit("Remote tag commit mismatch")

          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"MODEL_VERSION={version}\n")
              output.write(f"TRAINING_SHA={commit}\n")
              output.write(f"TAG_OBJECT={refs[tag_ref]}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")

          print("Resolved model version:", version)
          PY

          if gh release view "$MODEL_VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"
            exit 1
          fi

      - name: Download candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          set -euo pipefail

          mkdir -p release

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mlforge-optimization-results \
            --dir release

          for file in \
            best_model.joblib \
            metadata.json \
            metrics.json \
            provenance.json \
            confidence_intervals.json
          do
            test -s "release/$file" || {
              echo "::error::Missing candidate artifact: $file"
              exit 1
            }
          done

      - name: Download quality-gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          mkdir -p quality-evidence

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mlforge-quality-report \
            --dir quality-evidence

          test -s quality-evidence/quality_report.json
          test -s quality-evidence/promotion_evidence.json

      - name: Verify provenance and promotion evidence
        env:
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
          EXPECTED_DATASET_SHA256: "88be4b93fbe0cc83421af1c503794c97c342eca914c1576db7c276e61d61358a"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          import re
          from pathlib import Path

          def load(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8")
              )

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def digest(path):
              with Path(path).open("rb") as source:
                  return hashlib.file_digest(
                      source, "sha256"
                  ).hexdigest()

          root = Path("release")

          metadata = load(root / "metadata.json")
          metrics = load(root / "metrics.json")
          provenance = load(root / "provenance.json")
          intervals = load(root / "confidence_intervals.json")

          report = load(
              "quality-evidence/quality_report.json"
          )
          evidence = load(
              "quality-evidence/promotion_evidence.json"
          )

          candidate = evidence["candidate"]
          champion = evidence["champion"]
          evaluation = evidence["evaluation"]

          commit = os.environ["TRAINING_SHA"]
          dataset_hash = provenance.get("dataset_sha256")
          model_hash = digest(root / "best_model.joblib")

          require(
              provenance.get("git_commit") == commit,
              "Training provenance mismatch",
          )
          require(
              metadata.get("git_commit") == commit,
              "Metadata commit mismatch",
          )
          require(
              dataset_hash == os.environ["EXPECTED_DATASET_SHA256"],
              "Unexpected dataset fingerprint",
          )
          require(
              metadata.get("dataset_sha256") == dataset_hash,
              "Metadata dataset mismatch",
          )

          require(
              metadata.get("calibrated") is True,
              "Model is not calibrated",
          )
          require(
              metadata.get("calibration_method") == "sigmoid",
              "Unexpected calibration method",
          )

          threshold = float(metadata["threshold"])

          require(
              math.isfinite(threshold) and 0 <= threshold <= 1,
              "Invalid threshold",
          )
          require(
              math.isclose(
                  threshold,
                  float(metrics["threshold"]),
                  rel_tol=0,
                  abs_tol=1e-10,
              ),
              "Threshold mismatch",
          )

          features = metadata["features"]

          require(
              isinstance(features, list)
              and bool(features)
              and len(features) == len(set(features))
              and all(isinstance(f, str) for f in features),
              "Invalid feature schema",
          )

          for name in ("roc_auc", "pr_auc"):
              value = float(metrics[name])

              require(
                  math.isfinite(value) and 0 <= value <= 1,
                  f"Invalid metric: {name}",
              )

              interval = intervals[name]
              lower = float(interval["lower"])
              upper = float(interval["upper"])

              require(
                  math.isfinite(lower)
                  and math.isfinite(upper)
                  and 0 <= lower <= upper <= 1,
                  f"Invalid confidence interval: {name}",
              )

          for name in ("brier_score", "log_loss"):
              value = float(metrics[name])
              require(
                  math.isfinite(value) and value >= 0,
                  f"Invalid metric: {name}",
              )

          require(
              evidence.get("schema_version") == 1,
              "Unsupported promotion evidence schema",
          )
          require(
              candidate.get("training_run_id")
              == int(os.environ["TRAINING_RUN_ID"]),
              "Training run mismatch",
          )
          require(
              candidate.get("training_commit") == commit,
              "Candidate commit mismatch",
          )
          require(
              candidate.get("dataset_sha256") == dataset_hash,
              "Candidate dataset mismatch",
          )
          require(
              candidate.get("model_sha256") == model_hash,
              "Candidate checksum mismatch",
          )

          require(
              evaluation.get("run_id")
              == int(os.environ["QUALITY_RUN_ID"]),
              "Quality-gate run mismatch",
          )
          require(
              evaluation.get("workflow")
              == "MLForge - Model Quality Gate",
              "Unexpected evaluation workflow",
          )
          require(
              evaluation.get("quality_gate_passed") is True,
              "Quality gate did not pass",
          )
          require(
              report.get("passed") is True,
              "Quality report did not pass",
          )

          for evidence_key, report_key in (
              ("checks", "checks"),
              ("candidate_metrics", "candidate"),
              ("champion_metrics", "champion"),
              ("paired_bootstrap_95ci", "paired_bootstrap_95ci"),
          ):
              require(
                  evaluation.get(evidence_key)
                  == report.get(report_key),
                  f"Evidence mismatch: {evidence_key}",
              )

          require(
              re.fullmatch(
                  r"v[0-9]+\.[0-9]+\.[0-9]+",
                  champion.get("version", ""),
              ) is not None,
              "Invalid champion version",
          )
          require(
              re.fullmatch(
                  r"[0-9a-fA-F]{64}",
                  champion.get("model_sha256", ""),
              ) is not None,
              "Invalid champion checksum",
          )

          print("Training provenance verified")
          print("Quality-gate evidence verified")
          print("Candidate SHA-256:", model_hash)
          PY

      - name: Build release manifest
        env:
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          cp quality-evidence/quality_report.json release/
          cp quality-evidence/promotion_evidence.json release/

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release")

          def load(filename):
              return json.loads(
                  (root / filename).read_text(encoding="utf-8")
              )

          def digest(filename):
              with (root / filename).open("rb") as source:
                  return hashlib.file_digest(
                      source, "sha256"
                  ).hexdigest()

          metadata = load("metadata.json")
          metrics = load("metrics.json")
          provenance = load("provenance.json")
          intervals = load("confidence_intervals.json")
          evidence = load("promotion_evidence.json")

          files = [
              "best_model.joblib",
              "metadata.json",
              "metrics.json",
              "provenance.json",
              "confidence_intervals.json",
              "quality_report.json",
              "promotion_evidence.json",
          ]

          manifest = {
              "schema_version": "1.2",
              "release_version": os.environ["MODEL_VERSION"],
              "training_run_id": os.environ["TRAINING_RUN_ID"],
              "quality_gate_run_id": os.environ["QUALITY_RUN_ID"],
              "training_git_commit": provenance["git_commit"],
              "dataset": {
                  "filename": provenance.get("dataset_filename"),
                  "sha256": provenance["dataset_sha256"],
                  "size_bytes": provenance.get("dataset_size_bytes"),
              },
              "model": {
                  "algorithm": metadata["model"],
                  "threshold": metadata["threshold"],
                  "features": metadata["features"],
                  "best_params": metadata.get("best_params"),
                  "calibrated": True,
                  "calibration_method": "sigmoid",
              },
              "evaluation": {
                  key: metrics[key]
                  for key in (
                      "roc_auc",
                      "pr_auc",
                      "recall",
                      "f1",
                      "accuracy",
                      "precision",
                      "brier_score",
                      "log_loss",
                  )
                  if key in metrics
              },
              "confidence_intervals": intervals,
              "promotion": {
                  "quality_gate_passed": True,
                  "champion_version": evidence["champion"]["version"],
                  "candidate_model_sha256": evidence["candidate"][
                      "model_sha256"
                  ],
              },
              "environment": {
                  "python": provenance.get("python_version"),
                  "packages": provenance.get("packages", {}),
              },
              "file_sha256": {
                  filename: digest(filename)
                  for filename in files
              },
          }

          (root / "model_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with (root / "SHA256SUMS.txt").open(
              "w", encoding="utf-8"
          ) as output:
              for filename in [*files, "model_manifest.json"]:
                  output.write(
                      f"{digest(filename)}  {filename}\n"
                  )
          PY

          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Verify remote tag remains unchanged
        run: |
          set -euo pipefail

          REMOTE_INFO=$(git ls-remote origin \
            "refs/tags/$MODEL_VERSION" \
            "refs/tags/$MODEL_VERSION^{}")

          REMOTE_OBJECT=$(printf '%s\n' "$REMOTE_INFO" |
            awk -v ref="refs/tags/$MODEL_VERSION" \
              '$2 == ref {print $1}')

          REMOTE_COMMIT=$(printf '%s\n' "$REMOTE_INFO" |
            awk -v ref="refs/tags/$MODEL_VERSION^{}" \
              '$2 == ref {print $1}')

          test -n "$REMOTE_OBJECT"

          if [ "$REMOTE_OBJECT" != "$TAG_OBJECT" ]; then
            echo "::error::Tag object changed"
            exit 1
          fi

          RESOLVED="${REMOTE_COMMIT:-$REMOTE_OBJECT}"

          if [ "$RESOLVED" != "$TRAINING_SHA" ]; then
            echo "::error::Tag commit changed"
            exit 1
          fi

      - name: Publish release using existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$MODEL_VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"
            exit 1
          fi

          gh release create "$MODEL_VERSION" \
            release/best_model.joblib \
            release/metadata.json \
            release/metrics.json \
            release/provenance.json \
            release/confidence_intervals.json \
            release/quality_report.json \
            release/promotion_evidence.json \
            release/model_manifest.json \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MLForge Model $MODEL_VERSION" \
            --notes "Calibrated model with verified training provenance, champion-challenger quality-gate evidence, evaluation metrics, confidence intervals, and SHA-256 checksums. Production deployment requires separate approval."

      - name: Summarize publication
        if: success()
        env:
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          {
            echo "## MLForge Model Publication"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Model version | $MODEL_VERSION |"
            echo "| Training run | $TRAINING_RUN_ID |"
            echo "| Quality-gate run | $QUALITY_RUN_ID |"
            echo "| Verified commit | $TRAINING_SHA |"
            echo "| Existing tag | Reused unchanged |"
            echo "| Quality gate | Passed |"
            echo "| GitHub Release | Published |"
            echo "| Render deployment | Not performed |"
          } >> "$GITHUB_STEP_SUMMARY"
