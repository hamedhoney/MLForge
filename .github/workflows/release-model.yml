name: MLForge - Publish Model

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: "Successful Cloud Training workflow run ID"
        required: true
        type: string
      quality_gate_run_id:
        description: "Successful Model Quality Gate workflow run ID"
        required: true
        type: string
      version:
        description: "New immutable model version (e.g. v0.4.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mlforge-model-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify evidence and publish model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid model version"
            exit 1
          }

          [[ "$TRAINING_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid training run ID"
            exit 1
          }

          [[ "$QUALITY_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid quality-gate run ID"
            exit 1
          }

          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"
            exit 1
          fi

          if git ls-remote --exit-code origin \
            "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists"
            exit 1
          fi

          echo "Requested version: $VERSION"

      - name: Verify training workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          set -euo pipefail

          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,workflowName,event \
            > "$RUNNER_TEMP/training_run.json"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          info = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "training_run.json")
              .read_text(encoding="utf-8")
          )

          expected = {
              "conclusion": "success",
              "headBranch": "main",
              "workflowName": "MLForge - Cloud Training",
              "event": "workflow_dispatch",
          }

          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(
                      f"Invalid training run {key}: {info.get(key)!r}"
                  )

          commit = info.get("headSha", "")

          if not re.fullmatch(r"[0-9a-fA-F]{40}", commit):
              raise SystemExit("Invalid training commit")

          print("Verified training commit:", commit)
          PY

      - name: Download candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          set -euo pipefail

          mkdir -p release

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mlforge-optimization-results \
            --dir release

          for file in \
            best_model.joblib \
            metadata.json \
            metrics.json \
            provenance.json \
            confidence_intervals.json
          do
            test -s "release/$file" || {
              echo "::error::Missing candidate artifact: $file"
              exit 1
            }
          done

      - name: Verify quality-gate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headBranch,headSha,workflowName,event \
            > "$RUNNER_TEMP/quality_run.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "quality_run.json")
              .read_text(encoding="utf-8")
          )

          expected = {
              "conclusion": "success",
              "headBranch": "main",
              "workflowName": "MLForge - Model Quality Gate",
              "event": "workflow_dispatch",
          }

          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(
                      f"Invalid quality run {key}: {info.get(key)!r}"
                  )

          print("Quality-gate workflow verified")
          PY

      - name: Download promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          mkdir -p quality-evidence

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name mlforge-quality-report \
            --dir quality-evidence

          test -s quality-evidence/quality_report.json
          test -s quality-evidence/promotion_evidence.json

      - name: Verify candidate and promotion evidence
        env:
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
          EXPECTED_DATASET_SHA256: "88be4b93fbe0cc83421af1c503794c97c342eca914c1576db7c276e61d61358a"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          import re
          from pathlib import Path

          root = Path("release")
          temp = Path(os.environ["RUNNER_TEMP"])

          def load(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8")
              )

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def digest(path):
              with Path(path).open("rb") as source:
                  return hashlib.file_digest(
                      source, "sha256"
                  ).hexdigest()

          training = load(temp / "training_run.json")
          quality_run = load(temp / "quality_run.json")

          metadata = load(root / "metadata.json")
          metrics = load(root / "metrics.json")
          provenance = load(root / "provenance.json")
          intervals = load(root / "confidence_intervals.json")

          report = load(
              "quality-evidence/quality_report.json"
          )
          evidence = load(
              "quality-evidence/promotion_evidence.json"
          )

          candidate = evidence["candidate"]
          champion = evidence["champion"]
          evaluation = evidence["evaluation"]

          commit = training["headSha"]
          dataset_hash = provenance.get("dataset_sha256")
          model_hash = digest(root / "best_model.joblib")

          require(
              provenance.get("git_commit") == commit,
              "Training provenance commit mismatch",
          )
          require(
              metadata.get("git_commit") == commit,
              "Metadata commit mismatch",
          )
          require(
              dataset_hash == os.environ["EXPECTED_DATASET_SHA256"],
              "Unexpected dataset fingerprint",
          )
          require(
              metadata.get("dataset_sha256") == dataset_hash,
              "Metadata dataset mismatch",
          )

          require(
              metadata.get("calibrated") is True,
              "Model is not calibrated",
          )
          require(
              metadata.get("calibration_method") == "sigmoid",
              "Unexpected calibration method",
          )

          threshold = float(metadata["threshold"])
          require(
              math.isfinite(threshold)
              and 0 <= threshold <= 1,
              "Invalid threshold",
          )
          require(
              math.isclose(
                  threshold,
                  float(metrics["threshold"]),
                  rel_tol=0,
                  abs_tol=1e-10,
              ),
              "Threshold mismatch",
          )

          features = metadata["features"]
          require(
              isinstance(features, list)
              and bool(features)
              and len(features) == len(set(features))
              and all(isinstance(f, str) for f in features),
              "Invalid feature schema",
          )

          for name in ("roc_auc", "pr_auc"):
              value = float(metrics[name])
              require(
                  math.isfinite(value) and 0 <= value <= 1,
                  f"Invalid metric: {name}",
              )

              interval = intervals[name]
              lower = float(interval["lower"])
              upper = float(interval["upper"])

              require(
                  math.isfinite(lower)
                  and math.isfinite(upper)
                  and 0 <= lower <= upper <= 1,
                  f"Invalid confidence interval: {name}",
              )

          for name in ("brier_score", "log_loss"):
              value = float(metrics[name])
              require(
                  math.isfinite(value) and value >= 0,
                  f"Invalid metric: {name}",
              )

          require(
              evidence.get("schema_version") == 1,
              "Unsupported promotion evidence schema",
          )
          require(
              candidate.get("training_run_id")
              == int(os.environ["TRAINING_RUN_ID"]),
              "Candidate training run mismatch",
          )
          require(
              candidate.get("training_commit") == commit,
              "Candidate training commit mismatch",
          )
          require(
              candidate.get("dataset_sha256") == dataset_hash,
              "Candidate dataset mismatch",
          )
          require(
              candidate.get("model_sha256") == model_hash,
              "Candidate model checksum mismatch",
          )

          require(
              evaluation.get("run_id")
              == int(os.environ["QUALITY_RUN_ID"]),
              "Quality-gate run ID mismatch",
          )
          require(
              evaluation.get("workflow")
              == "MLForge - Model Quality Gate",
              "Unexpected evaluation workflow",
          )
          require(
              evaluation.get("quality_gate_passed") is True,
              "Quality gate did not pass",
          )
          require(
              report.get("passed") is True,
              "Quality report did not pass",
          )
          require(
              evaluation.get("checks") == report.get("checks"),
              "Quality checks mismatch",
          )
          require(
              evaluation.get("candidate_metrics")
              == report.get("candidate"),
              "Candidate evaluation metrics mismatch",
          )
          require(
              evaluation.get("champion_metrics")
              == report.get("champion"),
              "Champion evaluation metrics mismatch",
          )
          require(
              evaluation.get("paired_bootstrap_95ci")
              == report.get("paired_bootstrap_95ci"),
              "Bootstrap evidence mismatch",
          )

          require(
              re.fullmatch(
                  r"v[0-9]+\.[0-9]+\.[0-9]+",
                  champion.get("version", ""),
              ) is not None,
              "Invalid champion version",
          )
          require(
              re.fullmatch(
                  r"[0-9a-fA-F]{64}",
                  champion.get("model_sha256", ""),
              ) is not None,
              "Invalid champion checksum",
          )
          require(
              quality_run.get("conclusion") == "success",
              "Quality-gate workflow failed",
          )

          print("Training and quality-gate evidence verified")
          print("Candidate SHA-256:", model_hash)
          print("Champion:", champion["version"])
          PY

      - name: Build release manifest
        env:
          VERSION: ${{ inputs.version }}
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          set -euo pipefail

          cp quality-evidence/quality_report.json release/
          cp quality-evidence/promotion_evidence.json release/

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release")

          def load(filename):
              return json.loads(
                  (root / filename).read_text(encoding="utf-8")
              )

          def digest(filename):
              with (root / filename).open("rb") as source:
                  return hashlib.file_digest(
                      source, "sha256"
                  ).hexdigest()

          metadata = load("metadata.json")
          metrics = load("metrics.json")
          provenance = load("provenance.json")
          intervals = load("confidence_intervals.json")
          evidence = load("promotion_evidence.json")

          files = [
              "best_model.joblib",
              "metadata.json",
              "metrics.json",
              "provenance.json",
              "confidence_intervals.json",
              "quality_report.json",
              "promotion_evidence.json",
          ]

          manifest = {
              "schema_version": "1.2",
              "release_version": os.environ["VERSION"],
              "training_run_id": os.environ["TRAINING_RUN_ID"],
              "quality_gate_run_id": os.environ["QUALITY_RUN_ID"],
              "training_git_commit": provenance["git_commit"],
              "dataset": {
                  "filename": provenance.get("dataset_filename"),
                  "sha256": provenance["dataset_sha256"],
                  "size_bytes": provenance.get("dataset_size_bytes"),
              },
              "model": {
                  "algorithm": metadata["model"],
                  "threshold": metadata["threshold"],
                  "features": metadata["features"],
                  "best_params": metadata.get("best_params"),
                  "calibrated": True,
                  "calibration_method": "sigmoid",
              },
              "evaluation": {
                  key: metrics[key]
                  for key in (
                      "roc_auc",
                      "pr_auc",
                      "recall",
                      "f1",
                      "accuracy",
                      "precision",
                      "brier_score",
                      "log_loss",
                  )
                  if key in metrics
              },
              "confidence_intervals": intervals,
              "promotion": {
                  "quality_gate_passed": True,
                  "champion_version": evidence["champion"]["version"],
                  "candidate_model_sha256": evidence["candidate"][
                      "model_sha256"
                  ],
              },
              "environment": {
                  "python": provenance.get("python_version"),
                  "packages": provenance.get("packages", {}),
              },
              "file_sha256": {
                  filename: digest(filename)
                  for filename in files
              },
          }

          (root / "model_manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          with (root / "SHA256SUMS.txt").open(
              "w", encoding="utf-8"
          ) as output:
              for filename in [*files, "model_manifest.json"]:
                  output.write(
                      f"{digest(filename)}  {filename}\n"
                  )

          print("Release manifest generated")
          PY

          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish immutable model release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"
            exit 1
          fi

          if git ls-remote --exit-code origin \
            "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists"
            exit 1
          fi

          TRAINING_SHA=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "training_run.json")
              .read_text(encoding="utf-8")
          )
          print(info["headSha"])
          PY
          )

          echo "Publishing model $VERSION"
          echo "Training commit: $TRAINING_SHA"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$VERSION" \
            -f "sha=$TRAINING_SHA"

          gh release create "$VERSION" \
            release/best_model.joblib \
            release/metadata.json \
            release/metrics.json \
            release/provenance.json \
            release/confidence_intervals.json \
            release/quality_report.json \
            release/promotion_evidence.json \
            release/model_manifest.json \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MLForge Model $VERSION" \
            --notes "Calibrated MLForge model with verified training provenance, quality-gate evidence, evaluation metrics, confidence intervals, and SHA-256 checksums. Production deployment requires separate approval."

          gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets \
            --jq '{
              tag: .tagName,
              url: .url,
              assets: [.assets[].name]
            }'

      - name: Summarize publication
        if: success()
        env:
          VERSION: ${{ inputs.version }}
          TRAINING_RUN_ID: ${{ inputs.training_run_id }}
          QUALITY_RUN_ID: ${{ inputs.quality_gate_run_id }}
        run: |
          {
            echo "## MLForge Model Publication"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Model version | $VERSION |"
            echo "| Training run | $TRAINING_RUN_ID |"
            echo "| Quality-gate run | $QUALITY_RUN_ID |"
            echo "| Training provenance | Verified |"
            echo "| Quality-gate evidence | Verified |"
            echo "| Model checksums | Verified |"
            echo "| GitHub Release | Published |"
            echo "| Render deployment | Not performed |"
          } >> "$GITHUB_STEP_SUMMARY"
