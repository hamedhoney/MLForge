name: MLForge - Cloud Training

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Train and Evaluate Models
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check code quality
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run unit tests
        run: uv run --locked pytest -q

      - name: Download and validate dataset
        run: |
          uv run --locked python -c "
          from mlforge.data.loader import load_dataset
          X, y = load_dataset()
          print(f'Dataset ready: {X.shape}')
          print(f'Target distribution: {y.value_counts().to_dict()}')
          "

      - name: Train and evaluate models
        run: uv run --locked python -m mlforge.train

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlforge-churn-results
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
