
name: MLForge - Cloud Training

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Train and Evaluate Models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run training
        run: uv run --locked python -m mlforge.train

      - name: Upload trained models and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mlforge-training-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
