name: MLForge - Promote Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Published model version"
        required: true
        default: "v0.4.4"
        type: string
      deploy:
        description: "Deploy after manual production approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mlforge-production-promotion
  cancel-in-progress: false

env:
  API_URL: https://mlforge-api-xhej.onrender.com

jobs:
  validate:
    name: Verify candidate and production champion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      candidate: ${{ steps.verify.outputs.candidate }}
      champion: ${{ steps.verify.outputs.champion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate input
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          set -euo pipefail
          [[ "$MODEL_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          set -euo pipefail

          mkdir -p release

          gh release download "$MODEL_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release

          for file in \
            best_model.joblib \
            metadata.json \
            metrics.json \
            provenance.json \
            confidence_intervals.json \
            quality_report.json \
            promotion_evidence.json \
            model_manifest.json \
            SHA256SUMS.txt
          do
            test -s "release/$file"
          done

          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Verify original workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TRAINING_RUN=$(jq -r \
            '.training_run_id' release/model_manifest.json)

          QUALITY_RUN=$(jq -r \
            '.quality_gate_run_id' release/model_manifest.json)

          [[ "$TRAINING_RUN" =~ ^[0-9]+$ ]]
          [[ "$QUALITY_RUN" =~ ^[0-9]+$ ]]

          gh run view "$TRAINING_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headSha,headBranch,event,workflowName \
            > training-run.json

          gh run view "$QUALITY_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headSha,headBranch,event,workflowName \
            > evaluation-run.json

          mkdir -p original-evidence

          gh run download "$QUALITY_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name mlforge-quality-report \
            --dir original-evidence

          cmp release/promotion_evidence.json \
            original-evidence/promotion_evidence.json

          cmp release/quality_report.json \
            original-evidence/quality_report.json

      - name: Inspect production
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 --max-time 90 \
            "$API_URL/health" -o health.json

          curl --fail --silent --show-error \
            --retry 3 --max-time 90 \
            "$API_URL/model/info" -o production.json

      - name: Verify release and champion
        id: verify
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def load(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8")
              )

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          manifest = load("release/model_manifest.json")
          evidence = load("release/promotion_evidence.json")
          report = load("release/quality_report.json")
          training = load("training-run.json")
          evaluation_run = load("evaluation-run.json")
          health = load("health.json")
          production = load("production.json")

          candidate = evidence["candidate"]
          champion = evidence["champion"]
          evaluation = evidence["evaluation"]

          with Path("release/best_model.joblib").open("rb") as source:
              digest = hashlib.file_digest(
                  source, "sha256"
              ).hexdigest()

          version = os.environ["MODEL_VERSION"]
          commit = candidate["training_commit"]

          require(
              manifest["release_version"] == version,
              "Release version mismatch",
          )
          require(
              manifest["file_sha256"]["best_model.joblib"] == digest,
              "Manifest checksum mismatch",
          )
          require(
              candidate["model_sha256"] == digest,
              "Candidate checksum mismatch",
          )
          require(
              manifest["promotion"]["candidate_model_sha256"] == digest,
              "Promotion checksum mismatch",
          )
          require(
              manifest["promotion"]["quality_gate_passed"] is True,
              "Release quality gate failed",
          )
          require(
              report["passed"] is True,
              "Quality report failed",
          )
          require(
              evaluation["quality_gate_passed"] is True,
              "Promotion evidence failed",
          )
          require(
              isinstance(evaluation["checks"], dict)
              and bool(evaluation["checks"])
              and all(
                  value is True
                  for value in evaluation["checks"].values()
              ),
              "Quality checks failed",
          )

          for evidence_key, report_key in (
              ("checks", "checks"),
              ("candidate_metrics", "candidate"),
              ("champion_metrics", "champion"),
              ("paired_bootstrap_95ci", "paired_bootstrap_95ci"),
          ):
              require(
                  evaluation[evidence_key] == report[report_key],
                  f"Evidence mismatch: {evidence_key}",
              )

          require(
              manifest["promotion"]["champion_version"]
              == champion["version"],
              "Champion version mismatch",
          )

          for run, name in (
              (training, "MLForge - Cloud Training"),
              (evaluation_run, "MLForge - Model Quality Gate"),
          ):
              require(
                  run["conclusion"] == "success",
                  f"{name} failed",
              )
              require(
                  run["workflowName"] == name,
                  f"Unexpected workflow: {name}",
              )
              require(
                  run["event"] == "workflow_dispatch",
                  "Unexpected workflow event",
              )
              require(
                  run["headBranch"] == "main",
                  "Workflow was not run on main",
              )
              require(
                  run["headSha"] == commit,
                  "Workflow commit mismatch",
              )

          require(
              manifest["training_git_commit"] == commit,
              "Manifest commit mismatch",
          )
          require(
              candidate["training_run_id"]
              == int(manifest["training_run_id"]),
              "Training run mismatch",
          )
          require(
              evaluation["run_id"]
              == int(manifest["quality_gate_run_id"]),
              "Quality-gate run mismatch",
          )
          require(
              evaluation["workflow"]
              == "MLForge - Model Quality Gate",
              "Unexpected evidence workflow",
          )

          require(
              re.fullmatch(r"[0-9a-f]{40}", commit) is not None,
              "Invalid training commit",
          )

          output = subprocess.check_output(
              [
                  "git", "ls-remote", "origin",
                  f"refs/tags/{version}",
                  f"refs/tags/{version}^{{}}",
              ],
              text=True,
          )

          refs = {
              ref: sha
              for sha, ref in (
                  line.split()
                  for line in output.splitlines()
              )
          }

          tag = f"refs/tags/{version}"

          require(tag in refs, "Release tag missing")
          require(
              refs.get(f"{tag}^{{}}", refs[tag]) == commit,
              "Release tag commit mismatch",
          )

          require(
              health.get("status") == "ready"
              and health.get("model_loaded") is True,
              "Production API not ready",
          )
          require(
              production.get("model_version")
              == champion["version"],
              "Production champion has changed",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"candidate={version}\n")
              output.write(
                  f"champion={champion['version']}\n"
              )

          print("Candidate verified:", version)
          print("Champion verified:", champion["version"])
          PY

      - name: Summarize validation
        env:
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
          CHAMPION: ${{ steps.verify.outputs.champion }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          {
            echo "## MLForge Promotion Validation"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Candidate | $CANDIDATE |"
            echo "| Champion | $CHAMPION |"
            echo "| Evidence | Verified |"
            echo "| Production baseline | Verified |"
            echo "| Deployment requested | $DEPLOY |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Approved Render deployment
    needs: validate
    if: ${{ inputs.deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: production

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      CANDIDATE: ${{ needs.validate.outputs.candidate }}
      CHAMPION: ${{ needs.validate.outputs.champion }}

    steps:
      - name: Verify credentials
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          [[ "$RENDER_SERVICE_ID" =~ ^srv- ]]

      - name: Deploy with verification and rollback
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          key = os.environ["RENDER_API_KEY"]
          service = os.environ["RENDER_SERVICE_ID"]
          candidate = os.environ["CANDIDATE"]
          champion = os.environ["CHAMPION"]
          api = os.environ["API_URL"].rstrip("/")

          base = f"https://api.render.com/v1/services/{service}"
          variable = "MLFORGE_MODEL_VERSION"

          def request(url, method="GET", data=None, auth=False):
              headers = {"Accept": "application/json"}

              if auth:
                  headers["Authorization"] = f"Bearer {key}"

              if data is not None:
                  headers["Content-Type"] = "application/json"

              payload = (
                  json.dumps(data).encode("utf-8")
                  if data is not None
                  else None
              )

              req = Request(
                  url,
                  data=payload,
                  headers=headers,
                  method=method,
              )

              with urlopen(req, timeout=60) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          def configured_version():
              # Render returns a list of {cursor, envVar} objects.
              entries = request(
                  f"{base}/env-vars",
                  auth=True,
              )

              if not isinstance(entries, list):
                  raise RuntimeError(
                      "Unexpected Render environment response"
                  )

              matches = [
                  entry["envVar"]
                  for entry in entries
                  if isinstance(entry, dict)
                  and isinstance(entry.get("envVar"), dict)
                  and entry["envVar"].get("key") == variable
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Expected exactly one model version variable"
                  )

              return matches[0].get("value")

          def set_version(version):
              request(
                  f"{base}/env-vars/{quote(variable, safe='')}",
                  method="PUT",
                  data={"value": version},
                  auth=True,
              )

              # Read back configuration instead of trusting PUT alone.
              actual = configured_version()

              if actual != version:
                  raise RuntimeError(
                      "Render configuration update not verified"
                  )

          def running_version():
              health = request(f"{api}/health")
              info = request(f"{api}/model/info")

              if (
                  health.get("status") != "ready"
                  or health.get("model_loaded") is not True
              ):
                  raise RuntimeError("Production API unavailable")

              return info.get("model_version")

          def trigger_deploy():
              result = request(
                  f"{base}/deploys",
                  method="POST",
                  data={"clearCache": "do_not_clear"},
                  auth=True,
              )

              deploy_id = result.get("id")

              if not deploy_id:
                  raise RuntimeError("Missing Render deployment ID")

              return deploy_id

          def wait_for_deploy(deploy_id, timeout=900):
              deadline = time.monotonic() + timeout

              while time.monotonic() < deadline:
                  result = request(
                      f"{base}/deploys/{deploy_id}",
                      auth=True,
                  )

                  status = result.get("status")
                  print("Deployment status:", status, flush=True)

                  if status == "live":
                      return

                  if status in {
                      "build_failed",
                      "update_failed",
                      "canceled",
                      "deactivated",
                  }:
                      raise RuntimeError(
                          f"Render deployment failed: {status}"
                      )

                  time.sleep(15)

              raise TimeoutError("Render deployment timed out")

          def wait_for_model(expected, timeout=240):
              deadline = time.monotonic() + timeout

              while time.monotonic() < deadline:
                  try:
                      actual = running_version()

                      if actual == expected:
                          return

                      print(
                          f"Expected {expected}, observed {actual}",
                          flush=True,
                      )
                  except (
                      HTTPError,
                      URLError,
                      RuntimeError,
                  ):
                      print(
                          "Waiting for API readiness",
                          flush=True,
                      )

                  time.sleep(10)

              raise TimeoutError(
                  f"Model {expected} not verified"
              )

          # Recheck after GitHub environment approval.
          current = configured_version()

          if current != champion:
              raise SystemExit(
                  "Configured champion changed after approval"
              )

          if running_version() != champion:
              raise SystemExit(
                  "Running champion changed after approval"
              )

          print("Current champion:", champion, flush=True)
          print("Candidate:", candidate, flush=True)

          mutation_attempted = False

          try:
              # Begin production mutation.
              mutation_attempted = True
              set_version(candidate)

              deploy_id = trigger_deploy()
              print("Candidate deployment:", deploy_id, flush=True)

              wait_for_deploy(deploy_id)
              wait_for_model(candidate)

              if configured_version() != candidate:
                  raise RuntimeError(
                      "Final Render configuration mismatch"
                  )

              print(
                  "SUCCESS: production model verified:",
                  candidate,
                  flush=True,
              )

          except Exception as error:
              print(
                  "Promotion failed:",
                  type(error).__name__,
                  str(error) if not isinstance(error, HTTPError)
                  else f"HTTP {error.code}",
                  flush=True,
              )

              if mutation_attempted:
                  print(
                      "Attempting rollback to:",
                      champion,
                      flush=True,
                  )

                  try:
                      set_version(champion)

                      rollback_id = trigger_deploy()
                      print(
                          "Rollback deployment:",
                          rollback_id,
                          flush=True,
                      )

                      wait_for_deploy(rollback_id)
                      wait_for_model(champion)

                      if configured_version() != champion:
                          raise RuntimeError(
                              "Rollback configuration mismatch"
                          )

                      print(
                          "Rollback verified:",
                          champion,
                          flush=True,
                      )

                  except Exception as rollback_error:
                      raise SystemExit(
                          "CRITICAL: promotion failed and "
                          "rollback could not be verified"
                      ) from rollback_error

              raise SystemExit(
                  "Promotion failed; previous model restored "
                  "if rollback verification succeeded"
              ) from error
          PY

      - name: Summarize deployment
        if: success()
        env:
          CANDIDATE: ${{ needs.validate.outputs.candidate }}
          CHAMPION: ${{ needs.validate.outputs.champion }}
        run: |
          {
            echo "## MLForge Production Promotion"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Previous champion | $CHAMPION |"
            echo "| New production model | $CANDIDATE |"
            echo "| Manual approval | Required |"
            echo "| Render configuration | Verified |"
            echo "| Deployment | Successful |"
            echo "| Running model | Verified |"
            echo "| Rollback | Not required |"
          } >> "$GITHUB_STEP_SUMMARY"
