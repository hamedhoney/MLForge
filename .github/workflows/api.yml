name: MLForge - API Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/api.yml"

permissions:
  contents: read
  actions: read

jobs:
  api:
    name: Test and Build API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run API tests
        run: uv run --locked pytest tests/test_api.py -q

      - name: Download trained model from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=train.yml \
            --branch=main \
            --status=success \
            --limit=20 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No successful training run found"
            exit 1
          fi

          mkdir -p artifacts/tuning

          gh run download "$RUN_ID" \
            --name mlforge-optimization-results \
            --dir artifacts/tuning

          test -s artifacts/tuning/best_model.joblib
          test -s artifacts/tuning/metadata.json

      - name: Build Docker image
        run: docker build -t mlforge-api:test .

      - name: Start API container
        run: |
          docker run -d \
            --name mlforge-api \
            -p 7860:7860 \
            mlforge-api:test

      - name: Verify model readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health \
              | grep -q '"model_loaded":true'; then
              echo "Model loaded successfully"
              exit 0
            fi

            sleep 2
          done

          docker logs mlforge-api
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs mlforge-api || true
