name: MLForge - Initialize Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    name: Initialize Neon PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run --locked python - <<'PY'
          import os

          from mlforge.monitoring.storage import TelemetryStore

          database_url = os.environ["DATABASE_URL"]

          if database_url.startswith("postgresql://"):
              database_url = database_url.replace(
                  "postgresql://",
                  "postgresql+psycopg://",
                  1,
              )

          store = TelemetryStore(database_url)

          try:
              store.initialize()
              print("Neon telemetry schema initialized successfully")
          finally:
              store.close()
          PY
