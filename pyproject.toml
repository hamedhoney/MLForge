
[project]
name = "mlforge"
version = "0.1.0"
description = "End-to-end MLOps platform for automated machine learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "mlflow>=2.20,<4",
    "joblib>=1.4,<2",
    "kagglehub>=0.3,<1",
    "optuna>=4,<5",
    "shap>=0.46,<1",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlforge"]

[tool.ruff]
line-length = 88
target-version = "py312"
